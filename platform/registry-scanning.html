<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARMO · Registry Scanning</title><link rel="stylesheet" href="assets/app.css"></head>
<body data-page="registry-scanning" data-title="Registry Scanning">
  <div class="page-head"><div><h1>Registry Scanning</h1></div><div class="page-actions"><button class="btn">Connect registry</button><button class="btn primary">⤓ Export</button></div></div>

  <div class="card" style="margin-bottom:18px">
    <div class="widget-title">Total vulnerabilities</div>
    <div class="sev-tiles" id="totals"></div>
  </div>

  <div class="toolbar">
    <div class="filter-pill">Status ▾</div><div class="filter-pill">Scan time ▾</div><div class="filter-pill">Registry ▾</div>
    <div class="filter-pill">Repository ▾</div><div class="filter-pill">Image tag ▾</div>
    <div class="grow"></div>
    <div class="hotcve-toggle"><span class="switch off"></span> Fixable</div>
    <div class="hotcve-toggle"><span class="switch off"></span> RCE</div>
  </div>
  <div id="t"></div><div class="paginator" id="pager"></div>
<script src="assets/data.js"></script><script src="assets/shell.js"></script>
<script>
  const tot={Critical:41,High:312,Medium:596,Low:387,Negligible:120};
  const extra=`<div class="sev-tile"><span class="v pass">812</span><span class="l">Fixed</span></div><div class="sev-tile"><span class="v" style="color:var(--sev-crit)">9</span><span class="l">RCE</span></div>`;
  document.getElementById("totals").innerHTML = SEV.filter(s=>tot[s]!=null).map(s=>`<div class="sev-tile"><span class="v" style="color:${SEV_COLOR[s]}">${tot[s]}</span><span class="l">${s}</span></div>`).join("") + extra;
  const R=[
    {st:"Connected",scan:"Jun 5, 2026 08:14",reg:"docker.io/armo",repo:"payments-api",tag:"1.8.2",failed:{Critical:3,High:8,Medium:14,Low:6}},
    {st:"Connected",scan:"Jun 5, 2026 06:40",reg:"docker.io/library",repo:"nginx",tag:"1.25.1",failed:{Critical:1,High:5,Medium:9,Low:11}},
    {st:"Scanning",scan:"Jun 5, 2026 09:02",reg:"ghcr.io/armo",repo:"batch-worker",tag:"3.1",failed:{Critical:0,High:3,Medium:12,Low:8}},
    {st:"Connected",scan:"Jun 4, 2026 23:55",reg:"123.dkr.ecr.eu-central-1",repo:"auth-service",tag:"4.4",failed:{Critical:2,High:4,Medium:7,Low:3}},
  ];
  const STC={"Connected":"#049d54","Scanning":"#0090ff","Failed":"#e11900"};
  const rows=R.map(r=>`<tr class="clickable-row" onclick="go('vulnerabilities.html')">
    <td><span class="status-dot" style="background:${STC[r.st]}"></span></td>
    <td class="muted" style="white-space:nowrap">${r.scan}</td>
    <td class="strong mono">${r.reg}</td><td>${r.repo}</td><td class="mono">${r.tag}</td>
    <td style="min-width:210px">${sevbar(r.failed)}<div class="cellsub" style="margin-top:5px">${sevCounts(r.failed)}</div></td></tr>`).join("");
  document.getElementById("t").innerHTML = table([{t:"Stat."},{t:"Scan time"},{t:"Registry"},{t:"Repository"},{t:"Image tag"},{t:"Severity"}], rows);
  document.getElementById("pager").innerHTML = `<span>Images 1–4 of 1,284</span><span class="pg-btn">«</span><span class="pg-btn">‹</span><span class="pg-btn">›</span><span class="pg-btn">»</span>`;
</script></body></html>
