<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARMO · Registry Scanning</title><link rel="stylesheet" href="assets/app.css"></head>
<body data-page="registry-scanning" data-title="Registry Scanning">
  <div class="page-head" style="align-items:center"><div><h1>Registry Scanning</h1></div><div class="page-actions"><button class="btn">Connect registry</button></div></div>

  <div class="sev-tiles" style="margin-bottom:18px" id="tiles"></div>

  <div class="toolbar">
    <div class="filter-pill">+ Add filter</div>
    <div class="grow"></div><button class="btn sm">☆ Save filters</button><button class="btn sm">⤓</button>
  </div>
  <div id="t"></div>
<script src="assets/data.js"></script><script src="assets/shell.js"></script>
<script>
  const TILES=[
    {l:"Total Vulnerabilities",v:"11,068",fix:"7,998",rce:"782",c:"var(--txt)"},
    {l:"Critical",v:"211",fix:"211",rce:"66",c:"var(--sev-crit)"},
    {l:"High",v:"1,142",fix:"1,116",rce:"204",c:"var(--sev-high)"},
    {l:"Medium",v:"6,722",fix:"5,208",rce:"365",c:"#9a5a00"},
    {l:"Low",v:"2,783",fix:"1,408",rce:"139",c:"var(--sev-low)"},
    {l:"Negligible",v:"207",fix:"52",rce:"8",c:"#0072cc"},
    {l:"Unknown",v:"3",fix:"3",rce:"0",c:"#71717a"},
  ];
  document.getElementById("tiles").innerHTML = TILES.map(t=>`<div class="sev-tile" style="min-width:120px"><span class="v" style="color:${t.c}">${t.v}</span><span class="l">${t.l}</span><span class="cellsub">${t.fix} Fixable</span><span class="cellsub">${t.rce} RCE</span></div>`).join("");

  function fr(o){ return SEV.filter(s=>o[s]!=null).map(s=>`<span class="fr"><i style="background:${SEV_COLOR[s]}"></i>${o[s]}</span>`).join(""); }
  const R=[
    {scan:"Mar 9, 2026 02:00:26",reg:"quay.io",repo:"systemtests/webgoat",tag:"latest",f:{Critical:12,High:84,Medium:418,Low:194,Negligible:11}},
    {scan:"May 11, 2026 03:00:26",reg:"quay.io",repo:"systemtests/webgoat",tag:"latest",f:{Critical:18,High:92,Medium:568,Low:228,Negligible:19}},
    {scan:"Mar 16, 2026 02:00:31",reg:"quay.io",repo:"systemtests/webgoat",tag:"latest",f:{Critical:12,High:85,Medium:474,Low:198,Negligible:11}},
    {scan:"Mar 23, 2026 02:00:34",reg:"quay.io",repo:"systemtests/webgoat",tag:"latest",f:{Critical:14,High:84,Medium:473,Low:198,Negligible:11}},
    {scan:"Mar 30, 2026 03:00:28",reg:"quay.io",repo:"systemtests/webgoat",tag:"latest",f:{Critical:16,High:85,Medium:497,Low:198,Negligible:11}},
  ];
  const rows=R.map(r=>`<tr class="clickable-row" onclick="go('vulnerabilities.html')">
    <td><span class="status-dot" style="background:#049d54"></span></td>
    <td class="muted" style="white-space:nowrap">${r.scan}</td><td class="strong">${r.reg}</td><td class="muted">${r.repo}</td><td class="mono">${r.tag}</td>
    <td>${fr(r.f)}</td></tr>`).join("");
  document.getElementById("t").innerHTML = table([{t:"Stat."},{t:"Scan time"},{t:"Registry"},{t:"Repository"},{t:"Image tag"},{t:"Severity"}], rows);
</script></body></html>
