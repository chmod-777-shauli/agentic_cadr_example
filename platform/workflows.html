<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARMO · Workflows</title><link rel="stylesheet" href="assets/app.css"></head>
<body data-page="workflows" data-title="Workflows">
  <div class="page-head"><div><h1>Workflows</h1><div class="sub">Automate notifications and ticketing when findings match a trigger · <a>Learn more</a></div></div>
  <div class="page-actions"><button class="btn primary">+ Add workflow</button></div></div>
  <div class="toolbar">
    <div class="filter-pill">Name ▾</div><div class="filter-pill">Category ▾</div>
    <div class="grow"></div><button class="btn sm">☆ Save filters</button>
  </div>
  <div id="t"></div><div class="paginator" id="pager"></div>
<script src="assets/data.js"></script><script src="assets/shell.js"></script>
<script>
  const W=[
    {en:true,name:"Critical CVE → Jira",cat:"Vulnerabilities",assets:"Cluster: All and future | Namespace: All",upd:"Jun 4, 2026",by:"shauli",action:"Open a ticket — Jira"},
    {en:true,name:"Active threat → Slack",cat:"Runtime incidents",assets:"Cluster: All and future",upd:"Jun 3, 2026",by:"dana",action:"Alert to — #secops"},
    {en:true,name:"New attack path → Slack + Jira",cat:"Attack path",assets:"Cluster: 2 | Namespace: 4",upd:"Jun 1, 2026",by:"shauli",action:"Alert + ticket"},
    {en:false,name:"Compliance drift → Teams",cat:"Compliance",assets:"Cluster: All and future",upd:"May 22, 2026",by:"ops",action:"Alert to — Teams"},
  ];
  const rows=W.map(w=>`<tr class="clickable-row" onclick="toast('Edit workflow')">
    <td><span class="switch ${w.en?'':'off'}"></span></td><td class="strong">${w.name}</td><td>${w.cat}</td>
    <td class="muted" style="white-space:nowrap">${w.assets}</td><td class="muted">${w.upd}<div class="cellsub">by ${w.by}</div></td>
    <td class="muted">${w.action}</td><td class="col-end"><span class="chevbtn">✎</span></td></tr>`).join("");
  document.getElementById("t").innerHTML = table([{t:"Enable"},{t:"Name"},{t:"Category"},{t:"Affected assets"},{t:"Last update"},{t:"Action"},{t:"",cls:"col-end"}], rows);
  document.getElementById("pager").innerHTML = `<span>Workflows 1–4 of 12</span><span class="pg-btn">«</span><span class="pg-btn">‹</span><span class="pg-btn">›</span><span class="pg-btn">»</span>`;
</script></body></html>
