<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARMO · Security Risks</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="security-risks" data-title="Security Risks">

  <div class="page-head" style="align-items:center">
    <div><h1>Security Risks</h1></div>
    <div class="page-actions"><button class="btn primary">↻ Scan all</button></div>
  </div>

  <div class="banner info" style="margin-bottom:18px;justify-content:space-between">
    <span>✦ <b style="margin:0 4px">Smart Remediation:</b> 6 risks generating 167 issues can be safely fixed without disrupting your workloads.</span>
    <button class="btn sm" style="background:#fff">Show Smart Remediation</button>
  </div>

  <div class="toolbar">
    <div class="filter-pill">Cluster ▾</div><div class="filter-pill">Namespace ▾</div><div class="filter-pill">Workload ▾</div>
    <div class="filter-pill">Severity ▾</div><div class="filter-pill">Risk category ▾</div><div class="filter-pill">Smart remediation ▾</div><div class="filter-pill">Ticket ▾</div>
    <div class="grow"></div><button class="btn sm">☆ Save filters</button>
  </div>

  <div class="widgets-row">
    <div class="card"><div class="widget-title">Issues by Risk Severity</div><div class="gauge-row"><div id="wDonut"></div><div id="wLegend" style="flex:1"></div></div></div>
    <div class="card"><div class="widget-title">Risk Categories Overview</div><div id="wCat"></div></div>
    <div class="card"><div class="widget-title">New vs Resolved · Open Issues</div><div id="wTrend"></div></div>
  </div>

  <div id="riskTable"></div>
  <div class="paginator" id="pager"></div>

<script src="assets/data.js"></script>
<script src="assets/shell.js"></script>
<script>
  // ---- widgets (match real screen: donut + categories list + new/resolved & open) ----
  const issueSeg=[{label:"Critical",value:57,color:SEV_COLOR.Critical},{label:"High",value:31,color:SEV_COLOR.High},{label:"Medium",value:88,color:SEV_COLOR.Medium},{label:"Low",value:187,color:SEV_COLOR.Low}];
  document.getElementById("wDonut").innerHTML = donut(issueSeg);
  document.getElementById("wLegend").innerHTML = legend(issueSeg);

  const cats=[["Workloads",4],["RBAC configuration",38],["Network configuration",21],["Attack path",7],["Secret management",12],["Vulnerabilities",85]];
  document.getElementById("wCat").innerHTML = cats.map(([nm,v])=>`<div class="rank" style="border-top:1px solid var(--line-soft);padding:8px 0"><div class="nm">${nm}</div><div class="ct">${v}</div></div>`).join("");

  document.getElementById("wTrend").innerHTML =
    `<svg class="spark" viewBox="0 0 160 50" preserveAspectRatio="none" style="height:50px">
      <polyline fill="none" stroke="#e11900" stroke-width="2.2" points="0,38 20,33 40,36 60,26 80,29 100,21 120,24 140,15 160,19"/>
      <polyline fill="none" stroke="#049d54" stroke-width="2.2" points="0,48 20,46 40,45 60,43 80,41 100,40 120,38 140,37 160,35"/>
    </svg>
    <div class="legend" style="flex-direction:row;gap:18px;margin:8px 0 12px"><div class="it"><i style="background:#e11900"></i>New <span class="v" style="margin-left:4px">+24</span></div><div class="it"><i style="background:#049d54"></i>Resolved <span class="v" style="margin-left:4px">-46</span></div></div>
    <div style="border-top:1px solid var(--line-soft);padding-top:10px;display:flex;align-items:baseline;gap:8px"><span class="kpi-num" style="font-size:24px;margin:0">363</span><span class="muted">open issues</span></div>`;

  // ---- table ----
  const dlt=(n,dir)=> n>0 ? `<span class="dlt ${dir}">${dir==="up"?"▲ +":"▼ -"}${n}</span>` : `<span class="dlt zero">0</span>`;
  const rows = SECURITY_RISKS.map(r=>`
    <tr data-cluster="${r.cluster}" class="clickable-row" onclick='openRisk(${JSON.stringify(r).replace(/'/g,"&#39;")})'>
      <td class="col-sev"><span class="sevstrip" style="background:${SEV_COLOR[r.sev]}"></span></td>
      <td class="strong" style="font-size:14px">${r.name}${r.smart?'<span class="smart">✦ Smart fix</span>':''}</td>
      <td>${r.category}</td>
      <td class="muted" style="white-space:nowrap">${r.lastUpdated}</td>
      <td>${dlt(r.newC,"up")}</td>
      <td>${dlt(r.resolvedC,"down")}</td>
      <td class="muted" style="white-space:nowrap">Cluster: ${r.clusters} | Namespace: ${r.namespaces} | Resource: ${r.resources}</td>
      <td>${r.tickets?'<span class="tkt">🎫</span>':''}</td>
      <td class="col-end"><span class="chevbtn">›</span></td>
    </tr>`).join("");
  document.getElementById("riskTable").innerHTML = table(
    [{t:"",cls:"col-sev"},{t:"Risk name"},{t:"Category"},{t:"Last updated"},{t:"New"},{t:"Resolved"},{t:"Affected assets"},{t:""},{t:"",cls:"col-end"}], rows);

  document.getElementById("pager").innerHTML =
    `<span>Risks 1–${SECURITY_RISKS.length} of ${SECURITY_RISKS.length}</span><span class="pg-btn">«</span><span class="pg-btn">‹</span><span class="pg-btn">›</span><span class="pg-btn">»</span>`;

  function openRisk(r){
    openDrawer(`
      <div class="drawer-head">
        <div><span class="sevstrip" style="background:${SEV_COLOR[r.sev]}"></span> <span class="sev ${r.sev}" style="margin-left:6px">${r.sev}</span>
          <h2 style="margin-top:8px">${r.name}</h2>
          <div class="muted" style="margin-top:6px">${r.category} · updated ${r.lastUpdated}</div></div>
        <div class="x" onclick="closeDrawer()">✕</div>
      </div>
      <div class="drawer-body">
        <div class="grid cols-3">
          <div class="card kpi"><div class="kpi-label">Clusters</div><div class="kpi-num" style="font-size:22px">${r.clusters}</div></div>
          <div class="card kpi"><div class="kpi-label">Namespaces</div><div class="kpi-num" style="font-size:22px">${r.namespaces}</div></div>
          <div class="card kpi"><div class="kpi-label">Resources</div><div class="kpi-num" style="font-size:22px">${r.resources}</div></div>
        </div>
        <div class="section-label">Description</div>
        <p>ARMO groups every resource affected by <b>${r.name.toLowerCase()}</b> into this risk and prioritizes it using configuration, reachability and runtime signals.</p>
        ${r.smart?'<div class="banner info" style="margin:0 0 6px">✦ Smart Remediation available — one fix resolves multiple affected resources.</div>':''}
        <div class="section-label">Affected resources (${r.resources})</div>
        <div class="tbl-wrap"><table class="tbl"><tbody>
          <tr onclick='openWorkload("payments-api")'><td class="elink">payments-api</td><td class="muted">Deployment · payments</td><td>${sev(r.sev)}</td></tr>
          <tr onclick='openWorkload("auth-service")'><td class="elink">auth-service</td><td class="muted">Deployment · auth</td><td>${sev(r.sev)}</td></tr>
          <tr onclick='openWorkload("edge-proxy")'><td class="elink">edge-proxy</td><td class="muted">DaemonSet · prod</td><td>${sev(r.sev)}</td></tr>
        </tbody></table></div>
        <div style="display:flex;gap:8px;margin-top:18px">
          <button class="btn primary" onclick="toast('Ticket created for ${r.id}')">Create ticket</button>
          <button class="btn" onclick="go('risk-acceptance.html')">Accept risk</button>
          <button class="btn" onclick="go('attack-path.html')">View attack path</button>
        </div>
      </div>`);
  }
</script>
</body>
</html>
