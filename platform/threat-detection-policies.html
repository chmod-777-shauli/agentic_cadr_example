<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARMO · Threat Detection Policies</title><link rel="stylesheet" href="assets/app.css"></head>
<body data-page="threat-detection-policies" data-title="Threat Detection">
  <div class="page-head"><div><h1>Threat Detection</h1><div class="sub">Detection rules &amp; response policies for runtime incidents</div></div>
  <div class="page-actions"><button class="btn">Add custom rule</button><button class="btn primary">Create policy</button></div></div>
  <div class="tabs" id="tabs"><div class="tab active" data-v="policies">Policies</div><div class="tab" data-v="rules">Rules</div></div>
  <div class="toolbar"><div class="filter-pill on">Enabled ✕</div><div class="grow"></div><span class="count-note" id="cnt"></span></div>
  <div id="b"></div>
<script src="assets/data.js"></script><script src="assets/shell.js"></script>
<script>
  const policies=[["Critical workloads — auto-respond","52 incident types","Kill + Network Policy","prod-eu-1, prod-us-1",true],["Cloud detection (CDR)","AWS CloudTrail rules","Notify Slack + Jira","all accounts",true],["Staging — monitor only","All","Report",">staging-eu-1",true],["Crypto-mining","3 rules","Pause container","all clusters",false]];
  const rules=[["Reverse shell","Behavioral","Execution","Critical",true],["Crypto miner execution","Signature","Impact","Critical",true],["Suspicious binary from /tmp","Behavioral","Defense Evasion","High",true],["AWS root login anomaly","CDR","Initial Access","Critical",true],["Package manager at runtime","Behavioral","—","Low",false]];
  const V={
    policies(){ return table([{t:"Policy"},{t:"Scope rules"},{t:"Actions"},{t:"Clusters"},{t:"Enabled"}],
      policies.map(p=>`<tr onclick="closeDrawer()"><td class="strong">${p[0]}</td><td class="muted">${p[1]}</td><td><span class="tag">${p[2]}</span></td><td class="muted">${p[3]}</td><td>${p[4]?'<span class="pass">On</span>':'<span class="muted">Off</span>'}</td></tr>`).join("")); },
    rules(){ return table([{t:"Rule"},{t:"Type"},{t:"MITRE"},{t:"Severity"},{t:"Enabled"}],
      rules.map(r=>`<tr onclick="closeDrawer()"><td class="strong">${r[0]}</td><td><span class="tag">${r[1]}</span></td><td class="muted">${r[2]}</td><td>${sev(r[3])}</td><td>${r[4]?'<span class="pass">On</span>':'<span class="muted">Off</span>'}</td></tr>`).join("")); }
  };
  function show(v){ document.getElementById("b").innerHTML=V[v](); document.querySelectorAll("#tabs .tab").forEach(t=>t.classList.toggle("active",t.dataset.v===v)); document.getElementById("cnt").textContent=document.querySelectorAll("#b tbody tr").length+" results"; }
  document.querySelectorAll("#tabs .tab").forEach(t=>t.onclick=()=>show(t.dataset.v)); show("policies");
</script></body></html>
