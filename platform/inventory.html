<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARMO · Inventory</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="inventory" data-title="Inventory">

  <h1 style="font-size:20px;margin:4px 0 16px">Inventory</h1>

  <div class="toolbar" style="gap:8px">
    <div class="filter-pill">Account ▾</div><div class="filter-pill">Region ▾</div><div class="filter-pill">Host ▾</div>
    <div class="filter-pill">Type ▾</div><div class="filter-pill">Cluster ▾</div><div class="filter-pill">Namespace ▾</div>
    <div class="filter-pill">Workload ▾</div><div class="filter-pill">Risk factor ▾</div><div class="filter-pill">Profile status ▾</div>
    <span class="muted" style="font-size:13px;margin-left:6px">Save filters</span>
  </div>

  <div class="inv-grid inv-head">
    <span></span><span>Assets ⇅</span><span>Type ⇅</span><span>Risk factor ⇅</span><span>Profile status ⇅</span><span></span><span></span>
  </div>
  <div id="invList"></div>

<script src="assets/data.js"></script>
<script src="assets/shell.js"></script>
<script>
  const ROWS = [
    {n:"mysql",type:"Deployment",icon:"⟳",acct:"015253967648",flag:"🇫🇷",region:"eu-west-3",cluster:"arn:aws-eks-eu-west-3-015253967648-cluster-armo-cadr-demo-cluster",ns:"attack-suite",prof:"warn"},
    {n:"ping-app",type:"Deployment",icon:"⟳",acct:"015253967648",flag:"🇫🇷",region:"eu-west-3",cluster:"arn:aws-eks-eu-west-3-015253967648-cluster-armo-cadr-demo-cluster",ns:"attack-suite",prof:"warn"},
    {n:"secure-python-app",type:"Deployment",icon:"⟳",acct:"015253967648",flag:"🇫🇷",region:"eu-west-3",cluster:"arn:aws-eks-eu-west-3-015253967648-cluster-armo-cadr-demo-cluster",ns:"attack-suite",prof:"warn"},
    {n:"changedetection",type:"Deployment",icon:"⟳",acct:"015253967648",flag:"🇫🇷",region:"eu-west-3",cluster:"arn:aws-eks-eu-west-3-015253967648-cluster-armo-cadr-demo-cluster",ns:"attack-suite",prof:"warn"},
    {n:"test-pod-2",type:"Pod",icon:"◳",cluster:"do-fra1-tal-test-k8s",ns:"default",prof:"ok"},
    {n:"inventory-db",type:"Deployment",icon:"⟳",acct:"elated-pottery-310110",flag:"🇺🇸",region:"us-central1",cluster:"gke_elated-pottery-310110_us-central1-c_armo-platform-cluster",ns:"credit-data",prof:"ok"},
    {n:"productcatalogservice",type:"Deployment",icon:"⟳",acct:"elated-pottery-310110",flag:"🇺🇸",region:"us-central1",cluster:"gke_elated-pottery-310110_us-central1-c_armo-platform-cluster",ns:"product-catalog",prof:"ok"},
    {n:"emailservice",type:"Deployment",icon:"⟳",acct:"elated-pottery-310110",flag:"🇺🇸",region:"us-central1",cluster:"gke_elated-pottery-310110_us-central1-c_armo-platform-cluster",ns:"product-catalog",prof:"ok"},
  ];
  function sub(r){
    if(r.acct) return `Account: ${r.acct} | Region: ${r.flag} ${r.region} | Cluster: ${r.cluster} | Namespace: ${r.ns}`;
    return `Cluster: ${r.cluster} | Namespace: ${r.ns}`;
  }
  document.getElementById("invList").innerHTML = ROWS.map(r=>`
    <div class="inv-card inv-grid" onclick='openWorkload("${r.n}")'>
      <span class="inv-ic">${r.icon}</span>
      <div style="min-width:0"><div class="inv-name">${r.n}</div><div class="inv-sub">${sub(r)}</div></div>
      <span>${r.type}</span>
      <span></span>
      <span class="prof ${r.prof}">${r.prof==="ok"?"✓":"⚠"} Completed</span>
      <span class="inv-graph" onclick="event.stopPropagation();go('attack-path.html')">▦ Graph</span>
      <span class="muted">›</span>
    </div>`).join("");
</script>
</body>
</html>
