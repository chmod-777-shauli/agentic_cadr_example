<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARMO · Inventory</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="inventory" data-title="Inventory">

  <div class="page-head">
    <div><h1>Inventory</h1><div class="sub">Workloads, hosts and cloud assets ARMO observes</div></div>
  </div>

  <div class="toolbar">
    <div class="filter-pill">Cluster ▾</div>
    <div class="filter-pill">Namespace ▾</div>
    <div class="filter-pill">Kind ▾</div>
    <div class="filter-pill">Risk factor ▾</div>
    <div class="filter-pill">Profile status ▾</div>
    <div class="filter-pill">+ Add filter</div>
    <div class="grow"></div>
    <button class="btn sm">☆ Save filters</button>
  </div>

  <div id="invTable"></div>
  <div class="paginator" id="pager"></div>

<script src="assets/data.js"></script>
<script src="assets/shell.js"></script>
<script>
  function pstat(w){
    if(!w.status) return '<span class="muted">—</span>';
    const bar = (w.status==="Learning" && w.learn!=null && w.learn<100)
      ? `<span class="learnbar"><span style="width:${w.learn}%"></span></span> <span class="cellsub">${w.learn}%</span>` : "";
    return `<span class="pstat ${w.status}">${w.status}</span> ${bar}`;
  }
  const rows = WORKLOADS.map(w=>`
    <tr data-cluster="${w.cluster}" data-namespace="${w.ns}" class="clickable-row" onclick='openWorkload("${w.name}")'>
      <td class="col-icon"><div class="kind-ic">${KIND_ABBR[w.kind]||w.kind.slice(0,2)}</div></td>
      <td>
        <div class="strong" style="font-size:14px">${w.name}</div>
        <div class="cellsub">Cluster: ${w.cluster} | Namespace: ${w.ns}</div>
      </td>
      <td>${w.kind}</td>
      <td><div style="display:flex;flex-wrap:wrap;gap:4px">${(w.riskFactors||[]).map(rf=>`<span class="rf-chip">${rf}</span>`).join("") || '<span class="muted">—</span>'}</div></td>
      <td>${pstat(w)}</td>
      <td><button class="btn-graph" onclick="event.stopPropagation();go('attack-path.html')">▦ Graph</button></td>
      <td class="col-end"><span class="chevbtn">›</span></td>
    </tr>`).join("");
  document.getElementById("invTable").innerHTML = table(
    [{t:"",cls:"col-icon"},{t:"Assets"},{t:"Type"},{t:"Risk Factor"},{t:"Profile Status"},{t:""},{t:"",cls:"col-end"}], rows);

  document.getElementById("pager").innerHTML =
    `<span>Workloads 1–${WORKLOADS.length} of 312</span>
     <span class="pg-btn">«</span><span class="pg-btn">‹</span><span class="pg-btn">›</span><span class="pg-btn">»</span>`;
</script>
</body>
</html>
