<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARMO · Vulnerabilities</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="vulnerabilities" data-title="Vulnerabilities">

  <div class="page-head" style="align-items:center">
    <div class="toggle-group" id="tabs">
      <div class="tg on" data-v="cves">CVEs</div>
      <div class="tg" data-v="workloads">Workloads</div>
      <div class="tg" data-v="images">Images</div>
      <div class="tg" data-v="sbom">SBOM</div>
      <div class="tg" data-v="hosts">Hosts</div>
    </div>
    <div class="page-actions"><div class="spotlight-toggle"><span class="switch off"></span> Risk spotlight</div><button class="btn primary">↻ Scan</button></div>
  </div>

  <div class="toolbar" id="filters"></div>
  <div class="banner info" id="banner" style="margin-bottom:16px"></div>
  <div id="widgets"></div>
  <div class="toolbar" style="margin-top:-2px"><span class="count-note" id="cnt"></span><div class="grow"></div><button class="btn sm">⤓ Export</button></div>
  <div id="vbody"></div>

<script src="assets/data.js"></script>
<script src="assets/shell.js"></script>
<script>
  const FILT={
    cves:["Account","Region","Cluster","Namespace","Workload","CVE ID","Exploitable","Fixable"],
    workloads:["Cluster","Namespace","Workload","Vulnerabilities","Risk factor","In-use"],
    images:["Cluster","Namespace","Workload","Image","Vulnerabilities","Risk factor","CVE ID"],
    sbom:["Component","Version","Type","Image"],
    hosts:["Account","Region","Host","Vulnerabilities"]
  };
  const BANNER={
    cves:"Displaying 28,292 vulnerabilities. Use the filters to prioritize those that pose a real risk to your organization.",
    workloads:"Displaying 312 workloads. Use the filters to prioritize those that pose a real risk to your organization.",
    images:"Displaying 59 images. Use the filters to prioritize those that pose a real risk to your organization.",
    sbom:"Displaying 1,842 components across your images.",
    hosts:"Displaying 48 hosts. Use the filters to prioritize those that pose a real risk to your organization."
  };
  function cnts(o){ return SEV.filter(s=>o[s]!=null).map(s=>`<span style="color:${SEV_COLOR[s]};font-weight:700;margin-right:12px">${o[s]}</span>`).join(""); }

  const WIDGETS = `
    <div class="widgets-row" style="grid-template-columns:1.1fr 1.1fr 1.1fr">
      <div class="card"><div class="widget-title">Vulnerabilities by Severity</div>
        <div style="display:flex;align-items:center;gap:18px"><div class="kpi-num" style="font-size:26px;margin:0">28,292</div>
        <div style="flex:1">${sevbar({Critical:947,High:4021,Medium:14235,Low:4532,Negligible:4557})}
        <div style="margin-top:8px;font-size:12.5px;color:var(--txt-dim)">
          <div>Critical <b style="color:var(--sev-crit);float:right">947</b></div>
          <div>High <b style="color:var(--sev-high);float:right">4,021</b></div>
          <div>Medium <b style="color:#9a5a00;float:right">14,235</b></div>
          <div>Low <b style="color:var(--sev-low);float:right">4,532</b></div>
        </div></div></div>
      </div>
      <div class="card"><div class="widget-title">Exploited Vulnerabilities by Severity</div>
        ${hbars([{nm:"Critical",v:251,color:SEV_COLOR.Critical},{nm:"High",v:412,color:SEV_COLOR.High},{nm:"Medium",v:188,color:SEV_COLOR.Medium},{nm:"Low",v:43,color:SEV_COLOR.Low}])}
      </div>
      <div class="card"><div class="widget-title">New Vulnerabilities (Last 60 days)</div>
        <div class="kpi-num" style="font-size:26px;margin:4px 0 10px">5,184</div>
        ${sevbar({Critical:184,High:902,Medium:2841,Low:1257})}
        <div class="legend" style="flex-direction:row;gap:14px;margin-top:10px;flex-wrap:wrap"><div class="it"><i style="background:var(--sev-crit)"></i>Critical</div><div class="it"><i style="background:var(--sev-high)"></i>High</div><div class="it"><i style="background:var(--sev-med)"></i>Medium</div><div class="it"><i style="background:var(--sev-low)"></i>Low</div></div>
      </div>
    </div>`;

  const views = {
    cves(){
      const rows = CVES.map(c=>`<tr class="clickable-row" onclick="go('vulnerabilities.html')">
        <td>${sev(c.sev)}</td><td class="mono strong">${c.id}</td><td class="num strong">${c.cvss.toFixed(1)}</td>
        <td>${c.pkg} <span class="muted">${c.version}</span></td><td class="mono pass">${c.fix}</td>
        <td>${c.kev?'<span class="chip" style="color:#6b0047;background:#FFE8F3"><span class="dot" style="background:#6b0047"></span>Exploited</span>':'<span class="muted">—</span>'}</td>
        <td class="muted">Jun 2, 2026</td><td class="num">${c.workloads} wl · ${c.images} img</td></tr>`).join("");
      return table([{t:"Severity"},{t:"CVE"},{t:"CVSS",cls:"num"},{t:"Component"},{t:"Fixed in"},{t:"Exploitable"},{t:"Discovered"},{t:"Affected",cls:"num"}], rows);
    },
    images(){
      const rows = VULN_IMAGES.map(i=>`<tr class="clickable-row" onclick="closeDrawer()">
        <td class="strong">${i.registry}/${i.image}<div class="cellsub">:${i.tag}</div></td>
        <td class="muted">prod-eu-1</td><td class="muted">Jun 5, 2026</td>
        <td>${cnts({Critical:i.c,High:i.h,Medium:i.m,Low:i.l})}</td>
        <td>${i.c>1?'<span class="tkt">🎫</span>':''}</td><td class="muted">⋮</td></tr>`).join("");
      return table([{t:"Image"},{t:"Cluster"},{t:"Last seen"},{t:"Vulnerabilities"},{t:""},{t:""}], rows);
    },
    workloads(){
      const rows = VULN_WORKLOADS.map(w=>`<tr data-cluster="${w.cluster}" class="clickable-row" onclick='openWorkload("${w.name}")'>
        <td class="strong">${w.name}<div class="cellsub">${w.kind} · ${w.ns} · ${w.cluster}</div></td>
        <td>${cnts({Critical:w.c,High:w.h,Medium:w.m,Low:w.l})}</td>
        <td>${w.inUse?'<span class="chip" style="color:#049d54;background:#E4F6EC"><span class="dot" style="background:#049d54"></span>In use</span>':'<span class="muted">Not in use</span>'}</td></tr>`).join("");
      return table([{t:"Workload"},{t:"Vulnerabilities"},{t:"Runtime"}], rows);
    },
    sbom(){
      const pkgs=[["openssl","3.0.11","apk",42],["glibc","2.38","apk",61],["zlib","1.3","apk",55],["nginx","1.25.1","apk",21],["python3","3.11.6","apk",18],["libcurl","8.4.0","apk",37]];
      return table([{t:"Component"},{t:"Version"},{t:"Type"},{t:"Images",cls:"num"}], pkgs.map(p=>`<tr><td class="strong">${p[0]}</td><td class="mono">${p[1]}</td><td><span class="tag">${p[2]}</span></td><td class="num">${p[3]}</td></tr>`).join(""));
    },
    hosts(){
      const hosts=[["ip-10-2-31-4","prod-eu-1","Bottlerocket 1.19",{Critical:2,High:9,Medium:14,Low:7}],["ip-10-4-12-9","prod-us-1","Amazon Linux 2",{Critical:1,High:14,Medium:22,Low:11}],["ip-10-2-9-1","staging-eu-1","Ubuntu 22.04",{Critical:0,High:7,Medium:18,Low:9}]];
      return table([{t:"Host"},{t:"Cluster"},{t:"OS"},{t:"Vulnerabilities"}], hosts.map(h=>`<tr><td class="strong mono">${h[0]}</td><td class="muted">${h[1]}</td><td>${h[2]}</td><td>${cnts(h[3])}</td></tr>`).join(""));
    }
  };

  function show(v){
    document.getElementById("filters").innerHTML = FILT[v].map(f=>`<div class="filter-pill">${f} ▾</div>`).join("")+'<div class="filter-pill">+ Add filter</div><div class="grow"></div><button class="btn sm">☆ Save filters</button>';
    document.getElementById("banner").innerHTML = `📊 ${BANNER[v]}`;
    document.getElementById("widgets").innerHTML = v==="cves"?WIDGETS:"";
    document.getElementById("vbody").innerHTML = views[v]();
    document.querySelectorAll("#tabs .tg").forEach(t=>t.classList.toggle("on",t.dataset.v===v));
    document.getElementById("cnt").textContent = "Showing "+document.querySelectorAll("#vbody tbody tr").length+" of "+({cves:"28,292 CVEs",workloads:"312 workloads",images:"59 images",sbom:"1,842 components",hosts:"48 hosts"})[v];
  }
  document.querySelectorAll("#tabs .tg").forEach(t=>t.onclick=()=>show(t.dataset.v)); show("cves");
</script>
</body>
</html>
