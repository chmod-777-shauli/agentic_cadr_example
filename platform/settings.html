<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARMO · Settings</title><link rel="stylesheet" href="assets/app.css"></head>

<script src="assets/data.js"></script><script src="assets/shell.js"></script>

  document.getElementById("g1").innerHTML = [
    card("Cloud Accounts","3 connected · AWS, GCP"),
    card("Kubernetes Accounts","4 clusters connected"),

    card("Teams","12 members · 3 roles"),
    card("Frameworks & Controls","Custom controls, framework config"),
    card("Billing","Enterprise plan · renews Aug 2026"),
  ].join("");
  document.getElementById("g2").innerHTML = [
    card("Jira","Issue creation"),card("Slack","Notifications"),card("Linear","Issue creation"),card("GitHub Issues","Notifications"),
    card("Microsoft Sentinel","SIEM export"),card("Splunk","SIEM export"),card("Sumo Logic","SIEM export"),card("Webhook","Custom export"),
