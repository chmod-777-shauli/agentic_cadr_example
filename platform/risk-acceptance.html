<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARMO · Risk Acceptance</title><link rel="stylesheet" href="assets/app.css"></head>
<body data-page="risk-acceptance" data-title="Risk Acceptance">
  <h1 style="font-size:20px;margin:4px 0 12px">Risk Acceptance</h1>
  <div class="banner" style="background:var(--panel-2);border:1px solid var(--line);color:var(--txt-dim);margin-bottom:14px">ⓘ This page consolidates all accepted risks and lets you review and manage them.</div>

  <div class="tabs">
    <div class="tab active">Security Risks</div><div class="tab">Vulnerabilities</div><div class="tab">Compliance</div><div class="tab">Runtime Incidents</div>
  </div>

  <div class="toolbar">
    <div class="filter-pill">Risk name ▾</div><div class="filter-pill">Category ▾</div><div class="filter-pill">Severity ▾</div>
    <div class="filter-pill">Expiration Date ▾</div><div class="filter-pill">Accepted By ▾</div><div class="filter-pill">Acceptance Date ▾</div>
    <div class="grow"></div><button class="btn sm">☆ Save filters</button>
  </div>
  <div id="t"></div>
<script src="assets/data.js"></script><script src="assets/shell.js"></script>
<script>
  const X=[
    {name:"External facing workload with critical vulnerabilities and impacts",cat:"Attack path",sev:"High",exp:"NEVER",by:"shauli@armosec.io",acc:"Jun 4, 2026"},
    {name:"Privileged container",cat:"Workloads",sev:"High",exp:"NEVER",by:"yossib@armosec.io",acc:"Mar 17, 2026"},
    {name:"hostPath mount",cat:"Workloads",sev:"High",exp:"NEVER",by:"shauli@armosec.io",acc:"Feb 26, 2026"},
    {name:"Privileged container",cat:"Workloads",sev:"High",exp:"NEVER",by:"yossib@armosec.io",acc:"Dec 1, 2025"},
    {name:"Privileged container",cat:"Workloads",sev:"High",exp:"NEVER",by:"yossib@armosec.io",acc:"Sep 25, 2025"},
    {name:"Allow privilege escalation",cat:"Workloads",sev:"Medium",exp:"NEVER",by:"yossib@armosec.io",acc:"May 15, 2025"},
    {name:"Privileged container",cat:"Workloads",sev:"High",exp:"NEVER",by:"yossib@armosec.io",acc:"Mar 13, 2025"},
  ];
  const rows=X.map(x=>`<tr class="clickable-row" onclick="toast('Edit exception')">
    <td class="strong">${x.name}</td><td>${x.cat}</td><td>${sev(x.sev)}</td>
    <td class="muted">${x.exp==="NEVER"?'<span class="tag">NEVER</span>':x.exp}</td><td class="muted">${x.by}</td><td class="muted">${x.acc}</td>
    <td class="col-end"><span class="chevbtn">✎</span></td></tr>`).join("");
  document.getElementById("t").innerHTML = table([{t:"Risk name"},{t:"Category"},{t:"Severity"},{t:"Expiration date"},{t:"Accepted by"},{t:"Acceptance date"},{t:"",cls:"col-end"}], rows);
</script></body></html>
