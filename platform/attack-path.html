<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARMO · Attack Path</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="attack-path" data-title="Attack Path">

  <div class="page-head" style="align-items:center">
    <div><h1>Attack Path</h1></div>
    <div class="page-actions"><button class="btn primary">↻ Scan all</button></div>
  </div>

  <div class="toolbar">
    <div class="filter-pill">Cluster ▾</div><div class="filter-pill">Namespace ▾</div><div class="filter-pill">Workload ▾</div>
    <div class="filter-pill">First seen ▾</div><div class="filter-pill">Internet exposure ▾</div>
    <div class="grow"></div><span class="muted" style="font-size:13px">Clear filters</span>
  </div>

  <div id="acList"></div>

<script src="assets/data.js"></script>
<script src="assets/shell.js"></script>
<script>
  const CHAINS = [
    {id:"ac1", fs:"Jan 2, 2025 14:48:36", title:"External workload with cluster takeover roles", cluster:"armo-platform-cluster", workload:"public-web",
     stages:[{l:"Internet",i:"🌐",d:1},{l:"Initial Access",i:"↘",d:1},{l:"Execution",i:"⚙"},{l:"Privilege Esc.",i:"⬆",d:1},{l:"Cluster takeover",i:"☸",d:1}]},
    {id:"ac2", fs:"Jan 2, 2025 14:46:30", title:"Exposed public-web2 with critical vulnerabilities and 5 severe impacts", cluster:"armo-platform-cluster", workload:"public-web2",
     stages:[{l:"Internet",i:"🌐",d:1},{l:"Initial Access",i:"↘",d:1},{l:"Execution (images)",i:"📦",d:1},{l:"Secret Access",i:"🔑",d:1}]},
    {id:"ac3", fs:"Jan 2, 2025 13:55:01", title:"External workload with sensitive data exposure", cluster:"armo-platform-cluster", workload:"checkout",
     stages:[{l:"Internet",i:"🌐",d:1},{l:"Initial Access",i:"↘",d:1},{l:"Data Access",i:"🗄",d:1}]},
    {id:"ac4", fs:"Jan 1, 2025 22:10:09", title:"Compromised pod can reach cluster-admin via default service account", cluster:"prod-eu-1", workload:"sa-token",
     stages:[{l:"Pod",i:"⬢"},{l:"Service Account",i:"👤"},{l:"Cluster-admin",i:"☸",d:1}]},
  ];
  function flow(c){
    return `<div class="ac-flow">`+c.stages.map((s,idx)=>`
      <div class="ac-stage ${s.d?'danger':''}"><span class="lbl">${s.l}</span><span class="nd">${s.i}</span></div>
      ${idx<c.stages.length-1?'<span class="ac-arrow">→</span>':''}`).join("")+`</div>`;
  }
  document.getElementById("acList").innerHTML = CHAINS.map(c=>`
    <div class="ac-card" onclick='openWorkload("${c.workload}")'>
      <div>
        <div class="ac-fs">First seen: ${c.fs}</div>
        <div class="ac-desc">${c.title}</div>
        <div class="ac-meta"><b>Cluster:</b> ${c.cluster}</div>
        <div class="ac-meta"><b>Workload:</b> ${c.workload}</div>
      </div>
      ${flow(c)}
      <div><button class="btn primary" onclick="event.stopPropagation();toast('Opening remediation for ${c.workload}')">🔧 Fix</button></div>
    </div>`).join("");
</script>
</body>
</html>
