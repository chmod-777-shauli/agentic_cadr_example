<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARMO · Attack Path</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="attack-path" data-title="Attack Path">

  <div class="page-head">
    <div><h1>Attack Path</h1></div>
    <div class="page-actions"><button class="btn primary">↻ Scan all</button></div>
  </div>

  <div class="toolbar">
    <div class="filter-pill">Cluster ▾</div>
    <div class="filter-pill">Namespace ▾</div>
    <div class="filter-pill">Severity ▾</div>
    <div class="grow"></div>
    <div class="spotlight-toggle"><span class="switch"></span> Risk spotlight</div>
  </div>

  <div id="acList"></div>
  <div class="paginator" id="pager"></div>

<script src="assets/data.js"></script>
<script src="assets/shell.js"></script>
<script>
  const CHAINS = [
    {id:"ac1", desc:"Internet-exposed payments-api can be reached and exploited to read cluster secrets", cluster:"prod-eu-1", ns:"payments", workload:"payments-api", firstSeen:"Jun 2, 2026", isNew:true,
     nodes:[{x:14,y:50,l:"🌐 Internet",d:1},{x:42,y:50,l:"payments-api",d:1},{x:72,y:32,l:"service-account"},{x:86,y:70,l:"🔑 secrets",d:1}], edges:[[0,1],[1,2],[2,3],[1,3]]},
    {id:"ac2", desc:"Public web-frontend allows lateral movement leading to RBAC privilege escalation", cluster:"prod-us-1", ns:"prod", workload:"web-frontend", firstSeen:"Jun 4, 2026", isNew:true,
     nodes:[{x:14,y:50,l:"🌐 Internet",d:1},{x:40,y:50,l:"web-frontend",d:1},{x:66,y:35,l:"pod"},{x:88,y:60,l:"cluster-admin",d:1}], edges:[[0,1],[1,2],[2,3]]},
    {id:"ac3", desc:"Exposed auth-service exposes database credentials to an external attacker", cluster:"prod-us-1", ns:"auth", workload:"auth-service", firstSeen:"May 30, 2026", isNew:false,
     nodes:[{x:14,y:50,l:"🌐 LB",d:1},{x:44,y:50,l:"auth-service",d:1},{x:80,y:50,l:"🔑 DB creds",d:1}], edges:[[0,1],[1,2]]},
    {id:"ac4", desc:"Compromised pod can reach cluster-admin via a default service account token", cluster:"prod-eu-1", ns:"kube-system", workload:"sa-token", firstSeen:"Jun 1, 2026", isNew:false,
     nodes:[{x:18,y:50,l:"pod",d:1},{x:54,y:50,l:"default SA"},{x:86,y:50,l:"cluster-admin",d:1}], edges:[[0,1],[1,2]]},
  ];

  function miniGraph(c){
    const W=420,H=120;
    let svg=`<svg width="100%" height="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="position:absolute;inset:0">`;
    c.edges.forEach(([a,b])=>{ svg+=`<line x1="${c.nodes[a].x/100*W}" y1="${c.nodes[a].y/100*H}" x2="${c.nodes[b].x/100*W}" y2="${c.nodes[b].y/100*H}" stroke="#c3cbe0" stroke-width="2"/>`; });
    svg+=`</svg>`;
    return svg + c.nodes.map(n=>`<div class="ac-node ${n.d?'danger':''}" style="left:${n.x}%;top:${n.y}%"><span class="nd"></span>${n.l}</div>`).join("");
  }

  document.getElementById("acList").innerHTML = CHAINS.map(c=>`
    <div class="ac-card" data-cluster="${c.cluster}" data-namespace="${c.ns}" onclick='openWorkload("${c.workload}")'>
      <div>
        <div class="ac-fs">First seen: ${c.firstSeen} ${c.isNew?'<span class="ac-new">NEW</span>':''}</div>
        <div class="ac-desc">${c.desc}</div>
        <div class="ac-meta"><b>Cluster:</b> ${c.cluster}</div>
        <div class="ac-meta"><b>Namespace:</b> ${c.ns}</div>
        <div class="ac-meta"><b>Workload:</b> ${c.workload}</div>
      </div>
      <div class="ac-graph">${miniGraph(c)}</div>
      <div><button class="btn primary" onclick="event.stopPropagation();toast('Opening remediation for ${c.workload}')">🔧 Fix</button></div>
    </div>`).join("");

  document.getElementById("pager").innerHTML =
    `<span>Attack paths 1–${CHAINS.length} of ${CHAINS.length}</span><span class="pg-btn">«</span><span class="pg-btn">‹</span><span class="pg-btn">›</span><span class="pg-btn">»</span>`;
</script>
</body>
</html>
