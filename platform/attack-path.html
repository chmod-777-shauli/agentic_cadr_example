<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARMO · Attack Path</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="attack-path" data-title="Attack Path">

  <div class="page-head">
    <div><h1>Attack Path</h1><div class="sub">Exploitable chains from external exposure to sensitive assets</div></div>
  </div>

  <div class="grid cols-3" style="margin-bottom:16px">
    <div class="card kpi"><div class="kpi-label">Attack paths</div><div class="kpi-num" style="color:var(--sev-crit)">7</div></div>
    <div class="card kpi"><div class="kpi-label">Internet-exposed entrypoints</div><div class="kpi-num">3</div></div>
    <div class="card kpi"><div class="kpi-label">Reachable sensitive assets</div><div class="kpi-num">5</div></div>
  </div>

  <div class="grid" style="grid-template-columns: 340px 1fr">
    <div class="card pad0">
      <div class="card-head" style="padding:14px 16px 0"><h3>Attack paths</h3></div>
      <div id="pathList" style="margin-top:8px"></div>
    </div>
    <div class="card">
      <div class="card-head"><h3 id="pathTitle">Internet → payments-api → secrets</h3><span class="tag">approximated graph</span></div>
      <div class="graph-canvas" id="graph"></div>
      <div class="note">Graph is a visual approximation of the real KeyLines/Cytoscape attack-path view.</div>
    </div>
  </div>

<script src="assets/data.js"></script>
<script src="assets/shell.js"></script>
<script>
  const paths = [
    {t:"Internet → payments-api → secrets", sev:"Critical", hops:4},
    {t:"Internet → web-frontend → RBAC escalation", sev:"Critical", hops:5},
    {t:"Public LB → auth-service → DB credentials", sev:"High", hops:3},
    {t:"Compromised pod → cluster-admin", sev:"High", hops:2},
    {t:"Exposed dashboard → node takeover", sev:"Medium", hops:3},
  ];
  document.getElementById("pathList").innerHTML = paths.map((p,idx)=>`
    <div onclick="sel(${idx})" style="display:flex;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid var(--line-soft);cursor:pointer">
      ${sev(p.sev)}<div style="flex:1"><div style="font-weight:600;font-size:12.5px">${p.t}</div><div class="cellsub">${p.hops} hops</div></div></div>`).join("");

  const nodes = [
    {x:12,y:50,l:"🌐 Internet",d:1},{x:34,y:30,l:"LB / Ingress"},{x:34,y:70,l:"web-frontend"},
    {x:58,y:50,l:"payments-api",d:1},{x:80,y:30,l:"service-account"},{x:88,y:72,l:"🔑 secrets",d:1}
  ];
  const edges=[[0,1],[0,2],[1,3],[2,3],[3,4],[4,5],[3,5]];
  function drawGraph(){
    const g=document.getElementById("graph"); const W=g.clientWidth, H=g.clientHeight;
    let svg=`<svg width="100%" height="100%" style="position:absolute;inset:0">`;
    edges.forEach(([a,b])=>{ svg+=`<line x1="${nodes[a].x/100*W}" y1="${nodes[a].y/100*H}" x2="${nodes[b].x/100*W}" y2="${nodes[b].y/100*H}" stroke="#c3cbe0" stroke-width="2"/>`; });
    svg+=`</svg>`;
    g.innerHTML = svg + nodes.map(n=>`<div class="node ${n.d?'danger':''}" style="left:${n.x}%;top:${n.y}%"><span class="ni"></span>${n.l}</div>`).join("");
  }
  function sel(i){ document.getElementById("pathTitle").textContent = paths[i].t; }
  drawGraph(); window.addEventListener("resize", drawGraph);
</script>
</body>
</html>
