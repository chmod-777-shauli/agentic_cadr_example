<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARMO · Repository Scanning</title><link rel="stylesheet" href="assets/app.css"></head>
<body data-page="repository-scanning" data-title="Repository Scanning">
  <div class="page-head" style="align-items:center"><div><h1>Repository Scanning</h1></div><div class="page-actions"><button class="btn">Scan repository</button></div></div>

  <div class="sev-tiles" style="margin-bottom:18px">
    <div class="sev-tile" style="min-width:150px"><span class="v">244</span><span class="l">Total Failed Resources</span></div>
    <div class="sev-tile"><span class="v" style="color:var(--sev-crit)">0</span><span class="l">Critical</span></div>
    <div class="sev-tile"><span class="v" style="color:var(--sev-high)">72</span><span class="l">High</span></div>
    <div class="sev-tile"><span class="v" style="color:#9a5a00">98</span><span class="l">Medium</span></div>
    <div class="sev-tile"><span class="v" style="color:var(--sev-low)">74</span><span class="l">Low</span></div>
  </div>

  <div class="toolbar">
    <div class="filter-pill">Provider ▾</div><div class="filter-pill">Repository ▾</div><div class="filter-pill">Owner ▾</div><div class="filter-pill">Branch ▾</div>
    <div class="filter-pill">Last scan ▾</div><div class="filter-pill">Frameworks ▾</div><div class="filter-pill">Ticket ▾</div>
    <div class="grow"></div><button class="btn sm">☆ Save filters</button>
  </div>
  <div id="t"></div>
<script src="assets/data.js"></script><script src="assets/shell.js"></script>
<script>
  function fr(o){ return SEV.filter(s=>o[s]!=null).map(s=>`<span class="fr"><i style="background:${SEV_COLOR[s]}"></i>${o[s]}</span>`).join(""); }
  const R=[
    {prov:"GitHub",repo:"github-action",owner:"kubescape",branch:"main",files:12,scan:"01/06/26, 5:28:32 PM",fw:"All",failed:{Critical:0,High:36,Medium:49,Low:37}},
  ];
  const rows=R.map(r=>`<tr class="clickable-row" onclick="toast('Open repository findings')">
    <td><span class="inv-ic" style="width:26px;height:26px">⎇</span></td><td class="strong">${r.repo}</td><td class="muted">${r.owner}</td>
    <td class="mono muted">${r.branch}</td><td class="num">${r.files}</td><td class="muted" style="white-space:nowrap">${r.scan}</td>
    <td class="muted">${r.fw}</td><td>${fr(r.failed)}</td></tr>`).join("");
  document.getElementById("t").innerHTML = table([{t:"Provider"},{t:"Repository"},{t:"Owner"},{t:"Branch"},{t:"Files",cls:"num"},{t:"Last scan"},{t:"Frameworks"},{t:"Failed Resources"}], rows);
</script></body></html>
